<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rocket Car Soccer</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>🚗 Rocket Car Soccer</h1><p>Blue vs Red · Bot or 2 Player</p></header><section class="scorebar"><div>🔵 Blue <b id="blueScore">0</b></div><label>Red player <select id="mode"><option value="bot">Bot</option><option value="p2">Player 2</option></select></label><div>🔴 Red <b id="redScore">0</b></div></section><div class="game"><div class="field" id="field"><div class="line"></div><div class="circle"></div><div class="goal left">GOAL</div><div class="goal right">GOAL</div><div id="ball" class="ball"></div><div id="p1" class="car blue"><i></i></div><div id="p2" class="car red"><i></i></div></div></div><p>Blue: Arrow keys + Shift boost · Red: WASD + Space boost</p><button id="reset">Reset Match</button><strong id="status">Kick-off!</strong></main><script src="game.js"></script></body></html>
